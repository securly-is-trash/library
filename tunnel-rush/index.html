<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Tunnel Rush</title>
    <link rel="stylesheet" href="https://raw.githubusercontent.com/wnasmile/LAMAR/refs/heads/main/tunnel-rush/style/style.css">
    <script src="https://raw.githubusercontent.com/wnasmile/LAMAR/refs/heads/main/tunnel-rush/UnityLoader.js"></script>
    <script src="https://raw.githubusercontent.com/wnasmile/LAMAR/refs/heads/main/tunnel-rush/UnityProgress.js"></script>
    <link rel="icon" href="https://raw.githubusercontent.com/wnasmile/LAMAR/refs/heads/main/tunnel-rush/img/tunnel.jpg">
    <script>
      var gameInstance = UnityLoader.instantiate("gameContainer", "build.json", {onProgress: UnityProgress,Module:{onRuntimeInitialized: function() {UnityProgress(gameInstance, "complete")}}});
    </script>
  </head>
  <body>
    <!-- 
-->
    <div class="webgl-content">
      <div id="gameContainer" style="width: 100%; height: 95%; margin: auto;"></div>
	  <div class="footer">
	            <div class="webgl-logo"></div>
	            <div class="fullscreen" onclick="gameInstance.SetFullscreen(1)"></div>
	            <div class="title">Tunnel Rush</div>
	        </div>
    </div>
    <script type="application/javascript" src="https://raw.githubusercontent.com/wnasmile/LAMAR/refs/heads/main/js/main.js"></script>
  </body>
</html>
